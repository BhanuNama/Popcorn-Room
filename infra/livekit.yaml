# LiveKit Server Configuration for Popcorn Room
# Run with: livekit-server --config infra/livekit.yaml

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: false
  # When deployed on a VPS (Oracle Cloud / AWS / Hetzner), set your public IP or STUN:
  # stun_servers:
  #   - stun.l.google.com:19302

keys:
  devkey: secret

room:
  # Close empty rooms after 5 minutes
  empty_timeout: 300
  # Max participants per room
  max_participants: 50

logging:
  level: info
